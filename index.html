<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Quét QR CCCD</title>
    <!-- Bao gồm Bootstrap CSS -->
    <link href="scripts/bootstrap.min.css" rel="stylesheet"/>
    <script src="scripts/jquery-3.6.0.min.js"></script>
    <script src="scripts/bootstrap.bundle.min.js"></script>

    <style>
        .container {
            max-width: 1200px;
        }

        hr {
            margin-top: 32px;
        }

        .video-container {
            position: relative;
            margin-bottom: 20px;
        }

        .video-container video {
            width: 100%;
            border: 1px solid #ccc;
            filter: brightness(1.5) contrast(1.2);
        }

        .section-header {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .highlight-style-select,
        .inversion-mode-select {
            width: auto;
        }

        .row {
            display: flex;
            justify-content: space-between;
        }

        table th,
        table td {
            vertical-align: middle;
        }
    </style>
</head>

<body>
<div class="container mt-5">
    <!-- Header Section -->
    <h1 class="text-center mb-4">Demo Quét Mã QR</h1>

    <!-- Webcam Scanning Section -->
    <div class="row mb-5">
        <div class="col-lg-6 col-md-12">
            <h3 class="section-header">Quét từ Webcam:</h3>
            <div id="video-container" class="video-container">
                <video id="qr-video"></video>
            </div>
            <div class="mt-3">
                <label for="zoom-control">Zoom Level: <span id="zoom-value">1x</span></label>
                <input type="range" id="zoom-control" min="1" max="5" step="0.1" value="1">
                <button id="zoom-in" class="btn btn-primary">🔍 Zoom In</button>
                <button id="zoom-out" class="btn btn-secondary">🔎 Zoom Out</button>
            </div>
            <div class="mb-3 d-flex justify-content-between align-items-center">
                <label for="scan-region-highlight-style-select" class="me-2">Chọn kiểu đánh dấu</label>
                <select id="scan-region-highlight-style-select" class="form-select highlight-style-select">
                    <option value="default-style">Kiểu mặc định</option>
                    <option value="example-style-1">Kiểu tùy chỉnh 1</option>
                    <option value="example-style-2">Kiểu tùy chỉnh 2</option>
                </select>
            </div>
            <div class="mt-3 form-check">
                <input id="show-scan-region" type="checkbox" class="form-check-input">
                <label class="form-check-label" for="show-scan-region">Hiển thị vùng quét canvas</label>
            </div>
            <div class="mt-3">
                <select id="inversion-mode-select" class="form-select inversion-mode-select">
                    <option value="original">Quét màu gốc (QR đen trên nền sáng)</option>
                    <option value="invert">Quét với màu đảo ngược (QR sáng trên nền tối)</option>
                    <option value="both" selected>Quét tất cả</option>
                </select>
            </div>
        </div>

        <!-- Camera Settings and Results -->
        <div class="col-lg-6 col-md-12">
            <h4 class="section-header">Cài đặt Camera</h4>
            <div>
                <b>Thiết bị có camera: </b><span id="cam-has-camera"></span>
            </div>
            <div class="mb-3">
                <b>Camera ưa thích:</b>
                <select id="cam-list" class="form-select">
                    <option value="environment" selected>Camera phía sau (mặc định)</option>
                    <option value="user">Camera phía trước</option>
                </select>
            </div>
            <div>
                <b>Camera có đèn flash: </b><span id="cam-has-flash"></span>
            </div>
            <button id="flash-toggle" class="btn btn-outline-primary mt-2">📸 Đèn flash: <span
                    id="flash-state">tắt</span></button>

            <hr>

            <div>
                <b>Mã QR phát hiện: </b><span id="cam-qr-result">Chưa có</span>
            </div>
            <div>
                <b>Phát hiện lần cuối vào: </b><span id="cam-qr-result-timestamp"></span>
            </div>
            <div class="custom-button-group mt-3">
                <button id="start-button" class="btn btn-success w-100">Bắt đầu</button>
                <button id="stop-button" class="btn btn-danger ms-2 w-100">Dừng</button>
                <button id="reset-button" class="btn btn-secondary w-100">Reset</button>
            </div>
        </div>
    </div>

    <!-- File Scanning Section -->
    <h3 class="section-header">Quét từ File:</h3>
    <div class="mb-3">
        <input type="file" id="file-selector" class="form-control">
    </div>
    <div class="mb-3">
        <b>Mã QR phát hiện: </b><span id="file-qr-result">Chưa có</span>
    </div>

    <table id="qr-results-table" class="table table-bordered table-striped table-responsive">
        <thead>
        <tr>
            <th>#</th>
            <th>QR Code</th>
            <th>Timestamp</th>
        </tr>
        </thead>
        <tbody>
        <!-- QR scan results will be added here -->
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="./scripts/script.min.js"></script>
</body>

</html>
