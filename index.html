<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quét Thẻ Thông Tin Cá Nhân</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.0.2/tesseract.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h2 class="text-center mb-3">📷 Quét Thẻ Thông Tin Cá Nhân</h2>

        <!-- Camera QR Code Scanner -->
        <div class="card p-3 shadow">
            <h4>🔍 Quét Mã QR</h4>
            <div id="reader" class="mb-3"></div>
            <p><strong>Kết Quả QR:</strong> <span id="qrResult" class="text-primary">Đang chờ...</span></p>
            <button id="startScan" class="btn btn-success">📸 Bắt đầu quét</button>
            <button id="stopScan" class="btn btn-danger">⏹ Dừng quét</button>
        </div>

        <!-- OCR Image Upload -->
        <div class="card p-3 shadow mt-4">
            <h4>📄 Nhận diện văn bản từ hình ảnh</h4>
            <input type="file" id="imageUpload" class="form-control mb-2" accept="image/*">
            <p><strong>Thông tin trích xuất:</strong></p>
            <textarea id="ocrResult" class="form-control" rows="4" placeholder="Văn bản từ ảnh sẽ hiển thị tại đây..."></textarea>
        </div>

        <!-- Display Card Information -->
        <div class="card p-3 shadow mt-4">
            <h4>📋 Chi tiết thông tin thẻ</h4>
            <table class="table table-bordered">
                <tbody>
                    <tr><th>👤 Họ và tên:</th> <td id="fullName">---</td></tr>
                    <tr><th>🎂 Ngày sinh:</th> <td id="dob">---</td></tr>
                    <tr><th>📇 Số ID:</th> <td id="idNumber">---</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
